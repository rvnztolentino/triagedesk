name: Bug report
description: Something in TriageDesk does not work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include API keys, tokens, or real request data in this issue.

        Found a security vulnerability? Do not file it here. Follow `SECURITY.md` instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as an admin
        2. Open the review queue
        3. Approve a request
        4. See the error
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication or sign-up
        - Workspaces, invites, or members
        - Request submission or attachments
        - AI triage or the review queue
        - Tickets, activity, or notifications
        - Live demo workspace
        - Setup, configuration, or deployment
        - Something else
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Where you hit this.
      placeholder: |
        Running: local dev / self-hosted / Vercel
        Node: 24.x
        Browser: Chrome 141
        Commit: c0a9469
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Server logs or console output. Redact anything sensitive.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked `/api/health` and my configuration resolves
          required: false
        - label: This issue contains no credentials or real user data
          required: true

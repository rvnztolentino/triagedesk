# Weekly dependency and GitHub Actions updates. Minor and patch bumps are grouped
# into one pull request so routine updates stay reviewable; majors arrive alone
# because they are the ones likely to need code changes. Security updates are
# separate and are not delayed by this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

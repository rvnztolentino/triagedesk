name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Read-only token. CI only checks out code and runs checks, so it never needs to
# write to the repository, even on pull requests from forks.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Placeholders only. These checks compile and test the app; they never reach a
    # real Supabase, Clerk, or Groq project. Never put a real key here, in a
    # repository variable, or in a fork-visible context. If integration tests are
    # added later, put real values in Settings -> Secrets and variables -> Actions.
    env:
      AI_PROVIDER: groq
      GROQ_API_KEY: ci-placeholder
      GROQ_MODEL: openai/gpt-oss-20b
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SEED_ADMIN_EMAIL: admin@example.com
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_REQUEST_ATTACHMENTS_BUCKET: request-attachments
      RATE_LIMIT_SALT: ci-placeholder-salt

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PNPM
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
